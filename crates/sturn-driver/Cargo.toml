[package]
name = "sturn-driver"
description = "tamias-driver-sturn — pavo view driver over a repo's sturn coordination state plus engine ops dispatching to the sturn lib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["vcs", "sturn", "agents"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-sturn"
path = "src/main.rs"

[features]
# Embedded surfaces (pavo-driver-kit's surface layer) — optional,
# acyclic: the driver gains `cli`/`mcp` argv verbs that serve its own
# ops manifest; the standalone tamias-driver-cli/-mcp binaries front
# the same ops without any feature. default = view driver + `run`
# passthrough only.
default = []
cli = ["pavo-driver-kit/cli"]
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
sturn.workspace = true
sturn-core.workspace = true
sturn-wal.workspace = true
sturn-wal-git.workspace = true
sturn-ws.workspace = true
sturn-ws-git.workspace = true
sturn-odb.workspace = true
sturn-claim.workspace = true
sturn-ask.workspace = true
sturn-config.workspace = true
sturn-config-toml.workspace = true
clap.workspace = true
serde_json.workspace = true
# Git deps, not path: a fresh sturn clone has no sibling ../pavo
# checkout and CI must build without it. `version` is the crates.io
# fallback once pavo-protocol/pavo-driver-kit publish.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
# pavo driver-authoring kit — ndjson serve loop + manifest/ViewNode
# builders over pavo-protocol types. Same git source as
# pavo-protocol (they resolve to one commit, keeping the types
# identical).
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-sturn serve` binary.
# Git dep to match pavo-protocol above (path deps break
# type identity with git deps).
pavo-testkit = { git = "https://github.com/9aia/pavo" }
