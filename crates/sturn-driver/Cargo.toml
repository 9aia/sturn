[package]
name = "sturn-driver"
description = "tamias-driver-sturn — pavo view driver over a repo's sturn coordination state (read-only WAL fold)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["vcs", "sturn", "agents"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-sturn"
path = "src/main.rs"

[dependencies]
sturn-core.workspace = true
sturn-wal.workspace = true
sturn-wal-git.workspace = true
sturn-ws.workspace = true
sturn-ws-git.workspace = true
sturn-odb.workspace = true
sturn-claim.workspace = true
sturn-ask.workspace = true
sturn-config.workspace = true
sturn-config-toml.workspace = true
serde_json.workspace = true
# The public wire contract — sibling-checkout path dep until
# pavo-protocol is published (the whole 9aia org lives side-by-side
# under one parent dir; `version` is the crates.io fallback).
pavo-protocol = { path = "../../../pavo/crates/pavo-protocol", version = "0.1.0" }
