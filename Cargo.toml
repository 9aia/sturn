[workspace]
resolver = "2"
members = [
    "crates/sturn-cli",
    "crates/sturn-fuse",
    "crates/sturn-core",
    "crates/sturn-wal",
    "crates/sturn-wal-git",
    "crates/sturn-bus",
    "crates/sturn-bus-redb",
    "crates/sturn-ws",
    "crates/sturn-ws-git",
    "crates/sturn-git",
    "crates/sturn-claim",
    "crates/sturn-ask",
    "crates/sturn-config",
    "crates/sturn-driver",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/sturn"
description = "Ephemeral coordination engine — claims/ops/topics over VCS state"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
sturn = { path = "crates/sturn-cli", version = "1.0.0" }
sturn-core = { path = "crates/sturn-core", version = "1.0.0" }
sturn-wal = { path = "crates/sturn-wal", version = "1.0.0" }
sturn-wal-git = { path = "crates/sturn-wal-git", version = "1.0.0" }
sturn-bus = { path = "crates/sturn-bus", version = "1.0.0" }
sturn-bus-redb = { path = "crates/sturn-bus-redb", version = "1.0.0" }
sturn-ws = { path = "crates/sturn-ws", version = "1.0.0" }
sturn-ws-git = { path = "crates/sturn-ws-git", version = "1.0.0" }
sturn-git = { path = "crates/sturn-git", version = "1.0.0" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "89e51894b9cd118141fe66d1c8c1d114c60d4ea5" }
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "89e51894b9cd118141fe66d1c8c1d114c60d4ea5" }
sturn-claim = { path = "crates/sturn-claim", version = "1.0.0" }
sturn-ask = { path = "crates/sturn-ask", version = "1.0.0" }
sturn-fuse = { path = "crates/sturn-fuse", version = "1.0.0" }
sturn-config = { path = "crates/sturn-config", version = "1.0.0" }
sturn-driver = { path = "crates/sturn-driver", version = "1.0.0" }
tamias-deploy-systemd = { git = "ssh://git@github.com/9aia/tamias.git", rev = "cbbc0e048cd5f28358245dd3555bee274b8da19d", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "20dabb1ad957b22bc8f3432feeadee09aa69371a", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
redb = "3"
