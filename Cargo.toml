[workspace]
resolver = "2"
members = [
    "crates/sturn-cli",
    "crates/sturn-fuse",
    "crates/sturn-core",
    "crates/sturn-wal",
    "crates/sturn-wal-git",
    "crates/sturn-odb",
    "crates/sturn-bus",
    "crates/sturn-bus-redb",
    "crates/sturn-ws",
    "crates/sturn-ws-git",
    "crates/sturn-git",
    "crates/sturn-claim",
    "crates/sturn-ask",
    "crates/sturn-config",
    "crates/sturn-secret",
    "crates/sturn-keyring",
    "crates/sturn-dotenv",
    "crates/sturn-service",
    "crates/sturn-systemd",
    "crates/sturn-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/sturn"
description = "Ephemeral coordination engine — claims/ops/topics over VCS state"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
sturn = { path = "crates/sturn-cli", version = "0.1.0" }
sturn-core = { path = "crates/sturn-core", version = "0.1.0" }
sturn-wal = { path = "crates/sturn-wal", version = "0.1.0" }
sturn-wal-git = { path = "crates/sturn-wal-git", version = "0.1.0" }
sturn-odb = { path = "crates/sturn-odb", version = "0.1.0" }
sturn-bus = { path = "crates/sturn-bus", version = "0.1.0" }
sturn-bus-redb = { path = "crates/sturn-bus-redb", version = "0.1.0" }
sturn-ws = { path = "crates/sturn-ws", version = "0.1.0" }
sturn-ws-git = { path = "crates/sturn-ws-git", version = "0.1.0" }
sturn-git = { path = "crates/sturn-git", version = "0.1.0" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "782c10840149d9a62ac9aa2d0c3a440233ffc86b" }
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "782c10840149d9a62ac9aa2d0c3a440233ffc86b" }
sturn-claim = { path = "crates/sturn-claim", version = "0.1.0" }
sturn-ask = { path = "crates/sturn-ask", version = "0.1.0" }
sturn-fuse = { path = "crates/sturn-fuse", version = "0.1.0" }
sturn-config = { path = "crates/sturn-config", version = "0.1.0" }
sturn-secret = { path = "crates/sturn-secret", version = "0.1.0" }
sturn-keyring = { path = "crates/sturn-keyring", version = "0.1.0" }
sturn-dotenv = { path = "crates/sturn-dotenv", version = "0.1.0" }
sturn-service = { path = "crates/sturn-service", version = "0.1.0" }
sturn-systemd = { path = "crates/sturn-systemd", version = "0.1.0" }
sturn-driver = { path = "crates/sturn-driver", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
clap = { version = "4", features = ["derive"] }
redb = "3"
